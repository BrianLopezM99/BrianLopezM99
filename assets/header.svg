<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Brian López Medina — AI Engineer, Pentester and Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080D"/><stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
