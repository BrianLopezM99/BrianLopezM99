    <clipPath id="t0"><rect x="582" y="81" height="24" width="0"><animate attributeName="width" values="0.0;9.2;18.4;27.6;36.8;46.0;55.2;64.4;73.6;390" keyTimes="0.0;0.111;0.222;0.333;0.444;0.556;0.667;0.778;0.889;1" calcMode="discrete" begin="0.5s" dur="0.40s" fill="freeze"/></rect></clipPath><clipPath id="t2"><rect x="582" y="131" height="24" width="0"><animate attributeName="width" values="0.0;9.2;18.4;27.6;36.8;46.0;55.2;64.4;73.6;82.8;92.0;101.2;110.4;119.6;128.8;138.0;390" keyTimes="0.0;0.062;0.125;0.188;0.25;0.312;0.375;0.438;0.5;0.562;0.625;0.688;0.75;0.812;0.875;0.938;1" calcMode="discrete" begin="1.8s" dur="0.78s" fill="freeze"/></rect></clipPath><clipPath id="t5"><rect x="582" y="206" height="24" width="0"><animate attributeName="width" values="0.0;9.2;18.4;27.6;36.8;46.0;55.2;64.4;73.6;82.8;92.0;101.2;110.4;119.6;128.8;138.0;147.2;156.4;165.6;174.8;390" keyTimes="0.0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;0.95;1" calcMode="discrete" begin="3.6s" dur="1.02s" fill="freeze"/></rect></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="340" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="250" cy="190" rx="300" ry="170" fill="url(#glow)"/>
    <rect y="-4" width="1000" height="3" fill="#9FEF00" opacity="0.07">
      <animate attributeName="y" values="-4;344" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="18" fill="none" stroke="#1F2A3A"/>

  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#22D3EE" opacity="0">
    <text x="56" y="100">&gt; hello world, I'm</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.6s" fill="freeze"/>
  </g>
  <g font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="800" font-size="58" opacity="0">
    <text x="52" y="164" fill="#E6EDF3">Brian López</text>
    <text x="52" y="228" fill="url(#name)">Medina</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.8s" fill="freeze"/>
  </g>
  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" opacity="0">
    <text x="56" y="272" font-size="15" fill="#9FEF00">AI Engineer · Pentester · Software Engineer</text>
    <text x="56" y="300" font-size="14" fill="#8B949E">// based in Durango, México</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.8s" fill="freeze"/>
  </g>

  <g>
    <rect x="562" y="36" width="406" height="272" rx="12" fill="#0A0F17" fill-opacity="0.92" stroke="#243042"/>
    <path d="M562 48a12 12 0 0 1 12-12h382a12 12 0 0 1 12 12v18H562z" fill="#111927"/>
    <circle cx="582" cy="51" r="5.5" fill="#FF5F57"/>
    <circle cx="600" cy="51" r="5.5" fill="#FEBC2E"/>
    <circle cx="618" cy="51" r="5.5" fill="#28C840"/>
    <text x="765" y="55" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8B949E" text-anchor="middle">brian@kali: ~</text>
  </g>
  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xml:space="preserve">
    <text x="584" y="98" clip-path="url(#t0)"><tspan fill="#9FEF00">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text><text x="584" y="123" opacity="0"><tspan fill="#E6EDF3">brian</tspan><tspan fill="#8B949E"> :: </tspan><tspan fill="#22D3EE">ai engineer &amp; pentester</tspan><set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/></text><text x="584" y="148" clip-path="url(#t2)"><tspan fill="#9FEF00">$ </tspan><tspan fill="#E6EDF3">cat certs.txt</tspan></text><text x="584" y="173" opacity="0"><tspan fill="#9FEF00">[+] </tspan><tspan fill="#E6EDF3">eJPT  </tspan><tspan fill="#8B949E">......... </tspan><tspan fill="#9FEF00">passed</tspan><set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/></text><text x="584" y="198" opacity="0"><tspan fill="#22D3EE">[*] </tspan><tspan fill="#E6EDF3">OSCP  </tspan><tspan fill="#8B949E">......... </tspan><tspan fill="#22D3EE">in progress</tspan><set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/></text><text x="584" y="223" clip-path="url(#t5)"><tspan fill="#9FEF00">$ </tspan><tspan fill="#E6EDF3">htb --user BrianM</tspan></text><text x="584" y="248" opacity="0"><tspan fill="#9FEF00">[+] </tspan><tspan fill="#E6EDF3">rank: Hacker </tspan><tspan fill="#8B949E">-&gt; </tspan><tspan fill="#9FEF00">Pro Hacker</tspan><set attributeName="opacity" to="1" begin="4.8s" fill="freeze"/></text><text x="584" y="273" opacity="0"><tspan fill="#9FEF00">$ </tspan><set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/></text><rect x="603" y="260" width="9" height="16" fill="#9FEF00" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="5.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
