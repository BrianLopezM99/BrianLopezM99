<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Build it. Break it. Make it smarter.">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FEF00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FEF00"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="18" width="800" height="1.5" fill="url(#line)"/>
  <g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" text-anchor="middle">
    <text x="500" y="64" font-size="20" font-weight="700" fill="#9FEF00">Build it. Break it. Make it smarter.</text>
    <text x="500" y="92" font-size="13" fill="#8B949E">// thanks for stopping by — happy hacking</text>
  </g>
